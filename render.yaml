services:
  - type: web
    name: karigar-web
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: karigar-db
          property: connectionString

databases:
  - name: karigar-db
    plan: free
    region: oregon
    databaseName: karigar
    user: karigar_user

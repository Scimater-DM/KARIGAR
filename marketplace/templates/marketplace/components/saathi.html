{% load static %}

<!-- =========================================================
     SAATHI — Floating button
     ========================================================= -->

<button
    type="button"
    class="saathi-float"
    id="saathiFloat"
    onclick="openSaathi()"
    aria-label="Open Saathi"
    title="Open Saathi"
>
    <svg
        class="saathi-float__symbol"
        viewBox="0 0 120 120"
        aria-hidden="true"
    >
        <!-- woven outer rings -->
        <circle
            cx="60"
            cy="60"
            r="45"
            class="khadi-ring khadi-ring--outer"
        />

        <circle
            cx="60"
            cy="60"
            r="35"
            class="khadi-ring khadi-ring--middle"
        />

        <circle
            cx="60"
            cy="60"
            r="25"
            class="khadi-ring khadi-ring--inner"
        />

        <!-- woven thread -->
        <path
            d="M24 60
               C40 44 48 76 60 60
               C72 44 80 76 96 60"
            class="khadi-thread"
        />

        <!-- centre knot -->
        <circle
            cx="60"
            cy="60"
            r="4"
            class="khadi-dot"
        />
    </svg>
</button>


<!-- =========================================================
     SAATHI — Overlay
     ========================================================= -->

<div
    class="saathi-overlay"
    id="saathiOverlay"
    onclick="closeSaathi()"
></div>


<!-- =========================================================
     SAATHI — Side panel
     ========================================================= -->

<aside
    class="saathi-panel"
    id="saathiPanel"
    aria-hidden="true"
>

    <!-- Panel header -->
    <div class="saathi-panel__top">

        <div class="saathi-khadi-mark">

            <svg
                viewBox="0 0 120 120"
                aria-hidden="true"
            >
                <circle
                    cx="60"
                    cy="60"
                    r="45"
                    class="khadi-ring khadi-ring--outer"
                />

                <circle
                    cx="60"
                    cy="60"
                    r="35"
                    class="khadi-ring khadi-ring--middle"
                />

                <circle
                    cx="60"
                    cy="60"
                    r="25"
                    class="khadi-ring khadi-ring--inner"
                />

                <path
                    d="M24 60
                       C40 44 48 76 60 60
                       C72 44 80 76 96 60"
                    class="khadi-thread"
                />

                <circle
                    cx="60"
                    cy="60"
                    r="4"
                    class="khadi-dot"
                />
            </svg>

            <span>साथी</span>

        </div>


        <button
            type="button"
            class="saathi-close"
            onclick="closeSaathi()"
            aria-label="Close Saathi"
        >
            ×
        </button>

    </div>


    <!-- Introduction -->
    <div class="saathi-panel__intro">

        <span class="eyebrow">
            YOUR COMPANION
        </span>

        <h2>
            Hello,<br>
            <em>I'm Saathi.</em>
        </h2>

        <p>
            You don't have to figure everything out alone.
            Tell me what you need help with.
        </p>

    </div>


    <!-- Main actions -->
    <div class="saathi-panel__actions">

        <button
            type="button"
            onclick="saathiAction('Tell my story')"
        >
            <span class="saathi-action__number">
                01
            </span>

            <span>
                <strong>Tell my story</strong>
                <small>
                    Turn your story into your profile
                </small>
            </span>

            <span class="saathi-action__arrow">
                ↗
            </span>
        </button>


        <button
            type="button"
            onclick="saathiAction('Price my work')"
        >
            <span class="saathi-action__number">
                02
            </span>

            <span>
                <strong>Price my work</strong>
                <small>
                    Think through a fair price
                </small>
            </span>

            <span class="saathi-action__arrow">
                ↗
            </span>
        </button>


        <button
            type="button"
            onclick="saathiAction('Show my work')"
        >
            <span class="saathi-action__number">
                03
            </span>

            <span>
                <strong>Show my work</strong>
                <small>
                    Prepare your craft for discovery
                </small>
            </span>

            <span class="saathi-action__arrow">
                ↗
            </span>
        </button>


        <button
            type="button"
            onclick="saathiAction('Find buyers')"
        >
            <span class="saathi-action__number">
                04
            </span>

            <span>
                <strong>Find buyers</strong>
                <small>
                    Understand how your work can reach people
                </small>
            </span>

            <span class="saathi-action__arrow">
                ↗
            </span>
        </button>

    </div>

   <div
    class="saathi-story-result"
    id="saathiStoryResult"
    aria-live="polite"
></div>

    <!-- Voice -->
    <div class="saathi-panel__voice">

        <button
            type="button"
            onclick="startSaathiVoice()"
            class="saathi-voice"
        >

            <span class="saathi-voice__icon">
                ◉
            </span>

            <span>
                <strong>Speak to Saathi</strong>
                <small>
                    Voice interaction · English / Hindi
                </small>
            </span>

            <span class="saathi-voice__arrow">
                ↗
            </span>

        </button>

    </div>


    <!-- Panel footer -->
    <div class="saathi-panel__footer">

        <span>
            AI drafts. You decide.
        </span>

        <span>
            KARIGAR
        </span>

    </div>

</aside>
